version: '3.8'

services:
  laravel-app:
    image: abedelrahmand9/chatapp:v3
    ports:
      - "9000:80"
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # ⚠️ THIS PERSISTS YOUR USER UPLOADS AND LOGS
      - chat-storage:/var/www/storage
    depends_on:
      - chatapp-postgres
    networks:
      - chat-net

  chatapp-postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=chatapp_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - chat-net

volumes:
  pgdata:
  chat-storage: # 👈 Declare the new storage volume here

networks:
  chat-net:
    driver: bridge